<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background & Accent Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters with safe bounds -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Animations (GitHub-safe standard CSS) -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(240px); opacity: 0.2; }
      }
      @keyframes circuitDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beaconRing {
        0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 45px; opacity: 0; stroke-width: 0.5px; }
      }
      .pulse-hub { transform-origin: 120px 120px; animation: pulseGlow 4s infinite ease-in-out; }
      .scanner { animation: scanLine 5s infinite linear; }
      .circuit-line { stroke-dasharray: 10, 10; animation: circuitDash 8s infinite linear; }
      .radar-sweep { transform-origin: 120px 120px; animation: radarSweep 7s infinite linear; }
      .floating-node-1 { animation: floatNode 3.5s infinite ease-in-out; }
      .floating-node-2 { animation: floatNode 4.5s infinite ease-in-out 1s; }
      .beacon { animation: beaconRing 2.5s infinite cubic-bezier(0.2, 0.8, 0.4, 1); }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" fill="url(#bgGrad)" rx="16"/>
  <rect width="900" height="240" fill="url(#cyberGrid)" rx="16"/>

  <!-- Scanning Line -->
  <rect class="scanner" x="0" y="0" width="900" height="2" fill="url(#scanGrad)" opacity="0.6"/>

  <!-- Circuit Connector Lines -->
  <path class="circuit-line" d="M 120 120 L 220 120 L 250 80 L 350 80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 120 120 L 200 170 L 320 170" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <path class="circuit-line" d="M 850 50 L 780 50 L 750 90 L 680 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>
  <path class="circuit-line" d="M 880 190 L 800 190 L 770 150 L 700 150" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Left Radar & Purchase Engine Hub -->
  <g transform="translate(15, 0)">
    <!-- Radar concentric circles -->
    <circle cx="120" cy="120" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="120" cy="120" r="60" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="120" cy="120" r="35" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Radar Beacon Wave -->
    <circle class="beacon" cx="120" cy="120" r="10" fill="none" stroke="#38bdf8"/>

    <!-- Radar Rotating Beam -->
    <g class="radar-sweep">
      <path d="M 120 120 L 205 120 A 85 85 0 0 0 120 35 Z" fill="url(#primaryGrad)" opacity="0.12"/>
      <line x1="120" y1="120" x2="205" y2="120" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Center Phone / StoreKit Card Icon -->
    <g class="pulse-hub" transform="translate(92, 82)">
      <!-- Outer rounded phone shape -->
      <rect x="0" y="0" width="56" height="76" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#hubGlow)"/>
      <!-- Screen Notch -->
      <line x1="20" y1="6" x2="36" y2="6" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <!-- Subscription Check Symbol -->
      <circle cx="28" cy="38" r="15" fill="#38bdf8" fill-opacity="0.2"/>
      <path d="M 21 38 L 26 43 L 36 32" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Bottom Bar -->
      <line x1="22" y1="68" x2="34" y2="68" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Central Title & Descriptions -->
  <g transform="translate(255, 0)">
    <!-- Top Category Pill Tag -->
    <g class="floating-node-1" transform="translate(0, 32)">
      <rect x="0" y="0" width="235" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.85"/>
      <circle cx="12" cy="12" r="4" fill="#22c55e"/>
      <text x="24" y="16" fill="#a5b4fc" font-size="11" class="sub-text" letter-spacing="1">CURATED MONETIZATION STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="98" fill="url(#textGrad)" font-size="30" class="title-text" letter-spacing="0.5">
      Mobile In-App Purchases &amp; SDKs
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#f1f5f9" font-size="14.5" class="sub-text">
      The Curated Guide to Subscriptions, Paywalls, StoreKit &amp; Play Billing
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 162)">
      <!-- Pill 1: RevenueCat & Adapty -->
      <rect x="0" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="70" y="17" fill="#bae6fd" font-size="11" text-anchor="middle" class="sub-text">⚡ RevenueCat &amp; Adapty</text>

      <!-- Pill 2: StoreKit & Play Billing -->
      <rect x="150" y="0" width="165" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="232" y="17" fill="#c7d2fe" font-size="11" text-anchor="middle" class="sub-text">📱 StoreKit &amp; Play Billing</text>

      <!-- Pill 3: Paywall Experiments -->
      <rect x="325" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="397" y="17" fill="#e9d5ff" font-size="11" text-anchor="middle" class="sub-text">🧪 Paywall Experiments</text>

      <!-- Pill 4: Open Source Backends -->
      <rect x="480" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="552" y="17" fill="#a7f3d0" font-size="11" text-anchor="middle" class="sub-text">🔓 Open Source SDKs</text>
    </g>
  </g>

  <!-- Right Decorative Floating Analytics Nodes -->
  <g class="floating-node-2" transform="translate(760, 45)">
    <circle cx="60" cy="40" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <text x="60" y="46" font-size="15" text-anchor="middle">💳</text>
    
    <circle cx="20" cy="110" r="15" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <text x="20" y="115" font-size="13" text-anchor="middle">📊</text>
    
    <circle cx="85" cy="120" r="14" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <text x="85" y="125" font-size="12" text-anchor="middle">🚀</text>

    <!-- Node Connector Lines -->
    <line x1="60" y1="40" x2="20" y2="110" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="60" y1="40" x2="85" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="1" y="1" width="898" height="238" fill="none" stroke="url(#textGrad)" stroke-width="1.5" rx="15" opacity="0.4"/>
</svg>
