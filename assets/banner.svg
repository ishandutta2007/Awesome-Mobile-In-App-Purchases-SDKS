<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .bg-grid {
        stroke: #334155;
        stroke-opacity: 0.2;
        stroke-width: 1;
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: float2 5s ease-in-out infinite alternate;
      }
      .float-card-3 {
        animation: float3 7s ease-in-out infinite alternate;
      }
      .wave-path {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .glow-orb {
        animation: orbMove 10s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.25; }
        100% { transform: scale(1.05); opacity: 0.45; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes orbMove {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, -25px); }
      }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g class="bg-grid">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Dynamic Glowing Ambient Lighting Orbs (Background layer) -->
  <g class="glow-orb" opacity="0.3">
    <circle cx="200" cy="80" r="130" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="260" r="140" fill="#818cf8" filter="url(#glow)" />
    <circle cx="600" cy="320" r="100" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Dynamic Floating Decorative Tech Elements (Left & Right Flanks) -->
  <!-- Left Side: Subscription Metrics Card (Animated Float) -->
  <g class="float-card-1" filter="url(#softShadow)">
    <g transform="translate(60, 80)">
      <rect width="180" height="100" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="30" cy="32" r="12" fill="#38bdf8" fill-opacity="0.2" />
      <text x="30" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">StoreKit 2</text>
      <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Active Entitlements</text>
      <!-- Mini Chart Line -->
      <path d="M 24,84 Q 50,70 80,78 T 150,68" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <g class="float-card-2" filter="url(#softShadow)">
    <g transform="translate(70, 210)">
      <rect width="165" height="85" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" font-weight="bold">● LIVE VERIFIED</text>
      <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Google Play V9</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Receipt Sync: 100%</text>
    </g>
  </g>

  <!-- Right Side: Paywall A/B Testing Card & Revenue Metric (Animated Float) -->
  <g class="float-card-2" filter="url(#softShadow)">
    <g transform="translate(960, 75)">
      <rect width="180" height="105" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="30" cy="32" r="12" fill="#818cf8" fill-opacity="0.2" />
      <text x="30" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#818cf8" font-weight="bold" text-anchor="middle">📊</text>
      <text x="52" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Paywall A/B</text>
      <text x="24" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Variant B: +34% CVR</text>
      <!-- Progress Bar -->
      <rect x="24" y="76" width="132" height="6" rx="3" fill="#334155" />
      <rect x="24" y="76" width="98" height="6" rx="3" fill="url(#primaryGrad)" />
    </g>
  </g>

  <g class="float-card-1" filter="url(#softShadow)">
    <g transform="translate(970, 210)">
      <rect width="170" height="85" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c084fc" font-weight="bold">★ OPEN ECOSYSTEM</text>
      <text x="20" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">RevenueCat &amp; OSS</text>
      <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Unified In-App API</text>
    </g>
  </g>

  <!-- Flowing Dynamic Connection Waves in Background behind Title -->
  <path class="wave-path" d="M 180,180 C 350,110 420,230 600,180 C 780,130 850,250 1020,180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.35" />
  <circle class="pulse-circle" cx="600" cy="180" r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Center Foreground Title & Badge Area (Stands completely clear and unobstructed) -->
  <!-- Top Category Pill Tag -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#38bdf8" />
    <text x="-104" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Main Banner Title with Modern Gradient -->
  <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Mobile In-App Purchases &amp; SDKs
  </text>

  <!-- Subtitle Tagline in Foreground -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#cbd5e1" letter-spacing="0.2">
    The Definitive Guide to In-App Subscription Engines, Paywalls &amp; StoreKit Infrastructure
  </text>

  <!-- Platform Technology Highlights Carousel (Foreground Pills) -->
  <g transform="translate(600, 220)">
    <!-- Pill 1: RevenueCat -->
    <g transform="translate(-250, 0)">
      <rect x="-55" y="-15" width="110" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">RevenueCat</text>
    </g>
    <!-- Pill 2: Adapty -->
    <g transform="translate(-125, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">Adapty</text>
    </g>
    <!-- Pill 3: StoreKit 2 -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">StoreKit 2</text>
    </g>
    <!-- Pill 4: Play Billing -->
    <g transform="translate(130, 0)">
      <rect x="-55" y="-15" width="110" height="30" rx="15" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Play Billing v9</text>
    </g>
    <!-- Pill 5: Wildberry / OSS -->
    <g transform="translate(255, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">Open Source</text>
    </g>
  </g>

  <!-- Bottom Interactive / Quality Feature Bar -->
  <g transform="translate(600, 290)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
      🛡️ Server-Side Receipt Validation &nbsp;•&nbsp; ⚡ Real-Time Webhooks &nbsp;•&nbsp; 🧪 Paywall A/B Experiments &nbsp;•&nbsp; 📱 Cross-Platform Entitlements
    </text>
  </g>

  <!-- Banner Outer Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1" opacity="0.6" />
</svg>
